#! /usr/bin/env eggdrop
# =====================================================================
#  eggdrop.conf for QuakeNet  (Eggdrop 1.9.x / 1.10.x, Linux)
#  Change everything marked with  <-- CHANGE
# =====================================================================

##### BASICS #####
set username "mibot"                          ;# ident  <-- CHANGE
set admin "TuNick <email: tu@correo.com>"     ;# <-- CHANGE
set owner "TuNick"                            ;# your handle on the bot  <-- CHANGE
set network "QuakeNet"
set env(TZ) "Europe/Madrid"

set prefer-ipv6 0
#set vhost4 "1.2.3.4"                         ;# if your VPS has several IPs

##### LOGS #####
logfile mcobxs * "logs/mibot.log"
logfile jpk *   "logs/canales.log"
set log-time 1
set timestamp-format {[%H:%M:%S]}
set keep-all-logs 0
set switch-logfiles-at 300
set quiet-save 0
set console "mkcoblxs"

##### FILES #####
set userfile "mibot.user"
set pidfile "pid.mibot"
set userfile-perm 0600
set help-path "help/"
set text-path "text/"
set temp-path "/tmp"
set motd "text/motd"
set telnet-banner "text/banner"
set sort-users 0
set mod-path "modules/"

##### PARTYLINE (telnet/DCC) #####
# Connect with: telnet VPS_IP 3333  (or DCC CHAT from your client)
listen 3333 all
set protect-telnet 1
set require-p 1
set open-telnets 0
set stealth-telnets 1
set use-telnet-banner 0
set connect-timeout 15
set telnet-flood 5:60
set paranoid-telnet-flood 1
set resolve-timeout 7
set must-be-owner 1
set allow-dk-cmds 1
set dupwait-timeout 5
set default-flags ""

##### MODULES #####
loadmodule pbkdf2
loadmodule dns
loadmodule channels

set chanfile "mibot.chan"
set force-expire 0
set share-greet 0
set use-info 1
set allow-ps 0

set global-flood-chan 10:60
set global-flood-deop 3:10
set global-flood-kick 3:10
set global-flood-join 5:60
set global-flood-ctcp 3:60
set global-flood-nick 5:60
set global-aop-delay 5:30
set global-idle-kick 0
set global-chanmode "nt"
set global-stopnethack-mode 0
set global-revenge-mode 0
set global-ban-type 2           ;# *!*@host
set global-ban-time 120
set global-exempt-time 60
set global-invite-time 60

set global-chanset {
        -autoop         -autovoice
        -bitch          +cycle
        +dontkickops    +dynamicbans
        -dynamicexempts -dynamicinvites
        +enforcebans    -greet
        -inactive       -nodesynch
        -protectfriends +protectops
        -revenge        -revengebot
        -secret         -seen
        -shared         -statuslog
        +userbans       -userexempts
        -userinvites
}

loadmodule server
set net-type "QuakeNet"
set nick "MiBot"                              ;# <-- CHANGE
set altnick "MiBot??"
set realname "#mychannel bot"
set init-server {}

server add irc.quakenet.org 6667
set default-port 6667
set msg-rate 2
set keep-nick 1
set quiet-reject 1
set lowercase-ctcp 0
set answer-ctcp 3
set flood-msg 5:60
set flood-ctcp 3:60
set server-cycle-wait 60
set server-timeout 60
set servlimit 0
set check-stoned 1
set serverror-quit 1
set max-queue-msg 300
set trigger-on-ignore 0
set exclusive-binds 0
set double-mode 1
set double-server 1
set double-help 1
set optimize-kicks 1
set stack-limit 4
set nick-len 15                 ;# QuakeNet: NICKLEN=15

loadmodule ctcp
set ctcp-mode 0

loadmodule irc
set bounce-bans 0
set bounce-exempts 0
set bounce-invites 0
set bounce-modes 0
set max-bans 45                 ;# QuakeNet: MAXBANS=45
set max-modes 45
set modes-per-line 6            ;# QuakeNet: MODES=6
set kick-fun 0
set ban-fun 0
set learn-users 0
set wait-split 600
set wait-info 180
set mode-buf-length 200
set opchars "@"
set no-chanrec-info 0
set prevent-mixing 1
set use-exempts 0               ;# QuakeNet has no +e / +I
set use-invites 0
set kick-method 1
set include-lk 1
set rfc-compliant 1

# Security: remove /msg commands that aren't needed
unbind msg - ident *msg:ident
unbind msg - addhost *msg:addhost
# After creating your user with "/msg MiBot hello", uncomment this line and .rehash:
#unbind msg - hello *msg:hello

loadmodule notes
set notefile "mibot.notes"
set max-notes 50
set note-life 60
set allow-fwd 0
set notify-users 1
set notify-onjoin 1

loadmodule console
set console-autosave 1
set force-channel 0
set info-party 0

loadmodule seen

##### SCRIPTS #####
# Read every script as UTF-8 even if the bot starts without a UTF-8
# locale (cron, systemd, autobotchk).
encoding system utf-8

source scripts/alltools.tcl
source scripts/action.fix.tcl
source scripts/dccwhois.tcl

# Custom scripts. Two ways to load them (use only one):
#
# A) Everything in one file (dist/eggdrop-quakenet-utils.tcl copied to
#    scripts/). Comment out the list in B and uncomment this line:
#source scripts/eggdrop-quakenet-utils.tcl
#
# B) One file per script. Order matters: the libraries (web, timeutil)
#    before the scripts that use them, help.tcl last.
source scripts/web.tcl
source scripts/timeutil.tcl
source scripts/qauth.tcl
source scripts/antiproxy.tcl
source scripts/tools.tcl
source scripts/ipinfo.tcl
source scripts/utils.tcl
source scripts/youtube.tcl
source scripts/urltitle.tcl
source scripts/chanstats.tcl
source scripts/reminders.tcl
source scripts/feeds.tcl
source scripts/github.tcl
source scripts/wiki.tcl
source scripts/dictionary.tcl
source scripts/countdown.tcl
source scripts/ask.tcl
# Channel protection with Q (for a main channel bot, not a utility bot):
#source scripts/guard.tcl
source scripts/help.tcl

# Passwords and API keys live in secrets.tcl (not in git).
# Copy secrets.tcl.example to secrets.tcl and fill it in.
if {[file exists secrets.tcl]} {source secrets.tcl}

##### CHANNELS #####
# Better added from the partyline (.+chan #chan); they are saved in
# mibot.chan. Example initial setup:
#
#   .+chan #mychannel
#   .chanset #mychannel +antiproxy +ipinfo +utils +youtube +urltitle +chanstats
#   .chanset #mychannel +reminders +feeds +github +wiki +dict +countdown +ask
#   .chanset #mychannel greet-msg Welcome to %chan%, %nick%. Please read the topic :)
